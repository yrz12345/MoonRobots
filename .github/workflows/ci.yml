name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Toolchain
        run: moon version --all
      - name: Dependencies
        run: moon update
      - name: Format
        run: |
          moon fmt
          git diff --exit-code
      - name: Check all backends
        run: moon check --target all --deny-warn
      - name: Test all backends
        run: moon test --target all
      - name: Build native CLI
        run: moon build src/cmd/moonrobots --target native --release
      - name: Policy analysis smoke tests
        run: |
          moon run src/cmd/moonrobots --target native -- diff examples/policy-before.txt examples/policy-after.txt examples/regression-urls.txt --agent MoonBot --json
          moon run src/cmd/moonrobots --target native -- coverage examples/policy-after.txt examples/regression-urls.txt --agent MoonBot --json

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web quality dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser, accessibility and responsive checks
        run: npm run test:web
